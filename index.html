<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Клумба: цветочная головоломка</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="ambient-particles" id="ambientParticles" aria-hidden="true"></div>
  <div class="winter-decor" id="winterDecor" aria-hidden="true">
    <div class="snow-drift"></div>
    <svg class="fir-tree fir-tree-left" viewBox="0 0 48 72">
      <rect x="21" y="60" width="6" height="12" fill="#6b4a33"/>
      <path d="M24 6 L40 30 L32 30 L44 50 L34 50 L46 64 L2 64 L14 50 L4 50 L16 30 L8 30 Z" fill="#3f7a52"/>
      <circle cx="18" cy="34" r="2.2" fill="#fbf2e4"/>
      <circle cx="30" cy="44" r="2.2" fill="#fbf2e4"/>
      <circle cx="14" cy="52" r="2.2" fill="#fbf2e4"/>
      <circle cx="34" cy="56" r="2.2" fill="#fbf2e4"/>
    </svg>
    <svg class="fir-tree fir-tree-right" viewBox="0 0 48 72">
      <rect x="21" y="60" width="6" height="12" fill="#6b4a33"/>
      <path d="M24 6 L40 30 L32 30 L44 50 L34 50 L46 64 L2 64 L14 50 L4 50 L16 30 L8 30 Z" fill="#3f7a52"/>
      <circle cx="30" cy="34" r="2.2" fill="#fbf2e4"/>
      <circle cx="18" cy="44" r="2.2" fill="#fbf2e4"/>
      <circle cx="34" cy="52" r="2.2" fill="#fbf2e4"/>
      <circle cx="14" cy="56" r="2.2" fill="#fbf2e4"/>
    </svg>
  </div>
  <div class="screen loading-screen" id="loadingScreen">
    <div class="loading-mascot" id="loadingMascot" aria-hidden="true">
      <svg viewBox="0 0 48 40">
        <ellipse cx="24" cy="24" rx="18" ry="14" fill="#e0544f"/>
        <line x1="24" y1="11" x2="24" y2="37" stroke="#2a1f1c" stroke-width="2"/>
        <circle cx="16" cy="18" r="3" fill="#2a1f1c"/>
        <circle cx="32" cy="18" r="3" fill="#2a1f1c"/>
        <circle cx="16" cy="29" r="3" fill="#2a1f1c"/>
        <circle cx="32" cy="29" r="3" fill="#2a1f1c"/>
        <circle cx="24" cy="24" r="3" fill="#2a1f1c"/>
        <circle cx="24" cy="10" r="9" fill="#2a1f1c"/>
        <circle cx="20" cy="8" r="1.6" fill="#fdf6ee"/>
        <circle cx="28" cy="8" r="1.6" fill="#fdf6ee"/>
        <path d="M16 2 Q12 -2 10 2" stroke="#2a1f1c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M32 2 Q36 -2 38 2" stroke="#2a1f1c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="loading-title" id="loadingTitle"></h1>
    <div class="loading-pulse" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="visually-hidden" id="loadingStatusText"></p>
  </div>
  <div class="screen menu-screen" id="menuScreen" hidden>
    <div class="menu-card">
      <div class="menu-mascot" id="menuMascot" aria-hidden="true">
        <svg viewBox="0 0 48 40">
          <ellipse cx="24" cy="24" rx="18" ry="14" fill="#e0544f"/>
          <line x1="24" y1="11" x2="24" y2="37" stroke="#2a1f1c" stroke-width="2"/>
          <circle cx="16" cy="18" r="3" fill="#2a1f1c"/>
          <circle cx="32" cy="18" r="3" fill="#2a1f1c"/>
          <circle cx="16" cy="29" r="3" fill="#2a1f1c"/>
          <circle cx="32" cy="29" r="3" fill="#2a1f1c"/>
          <circle cx="24" cy="24" r="3" fill="#2a1f1c"/>
          <circle cx="24" cy="10" r="9" fill="#2a1f1c"/>
          <circle cx="20" cy="8" r="1.6" fill="#fdf6ee"/>
          <circle cx="28" cy="8" r="1.6" fill="#fdf6ee"/>
          <path d="M16 2 Q12 -2 10 2" stroke="#2a1f1c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M32 2 Q36 -2 38 2" stroke="#2a1f1c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="menu-title" id="menuTitle"></h1>
      <p class="menu-subtitle" id="menuSubtitle"></p>
      <button class="menu-button menu-play-button" id="playButton" type="button"></button>
      <button class="menu-button menu-secondary-button" id="howToPlayButton" type="button"></button>
      <button class="menu-button menu-secondary-button" id="menuSettingsButton" type="button"></button>
      <button class="menu-button menu-secondary-button checkin-menu-button" id="dailyCheckinButton" type="button">
        <span id="dailyCheckinLabel"></span>
        <span class="checkin-dot-badge" id="checkinBadge" hidden></span>
      </button>
      <button class="menu-button menu-daily-button" id="dailyChallengeButton" type="button" disabled hidden>
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="11" width="14" height="9" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        <span id="dailyChallengeCaption"></span>
      </button>
    </div>
  </div>
  <div class="screen game-screen" id="gameScreen" hidden>
  <header class="topbar">
    <button class="icon-button back-button" id="backButton" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="topbar-center">
      <div class="pill level-pill" id="levelIndicator"></div>
      <div class="pill score-pill">
        <svg class="leaf-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20C4 11 11 4 20 4C20 13 13 20 4 20Z"/><path d="M4 20L14 10" stroke="#16311f" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        <span id="scoreDisplay"></span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="lives" id="livesContainer"></div>
      <button class="icon-button settings-button" id="settingsButton" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <div class="milestone-banner" id="milestoneBanner" hidden>
    <span class="milestone-banner-title" id="milestoneBannerTitle"></span>
    <span class="milestone-banner-caption" id="milestoneBannerCaption"></span>
  </div>
  <div class="rules-area" id="rulesArea">
    <button class="rules-help-button" id="rulesHelpButton" type="button" hidden>?</button>
    <section class="rules-bar" id="rulesBar">
      <button class="overlay-close-button rules-popup-close" id="rulesCloseButton" type="button" hidden></button>
      <h2 class="rules-popup-title" id="rulesPopupTitle" hidden></h2>
      <div class="rule-card">
        <div class="rule-diagram">
          <div class="rule-cell bed x"><span class="mark-x"></span></div>
          <div class="rule-cell bed x"><span class="mark-x"></span></div>
          <div class="rule-cell bed x"><span class="mark-x"></span></div>
          <div class="rule-cell bed x"><span class="mark-x"></span></div>
          <div class="rule-cell bed flower"><span class="dot"></span></div>
          <div class="rule-cell"></div>
          <div class="rule-cell bed x"><span class="mark-x"></span></div>
          <div class="rule-cell"></div>
          <div class="rule-cell"></div>
        </div>
        <p class="rule-text" id="ruleTextBed"></p>
      </div>
      <div class="rule-card">
        <div class="rule-diagram">
          <div class="rule-cell x"><span class="mark-x"></span></div>
          <div class="rule-cell flower"><span class="dot"></span></div>
          <div class="rule-cell x"><span class="mark-x"></span></div>
          <div class="rule-cell"></div>
          <div class="rule-cell x"><span class="mark-x"></span></div>
          <div class="rule-cell"></div>
          <div class="rule-cell"></div>
          <div class="rule-cell x"><span class="mark-x"></span></div>
          <div class="rule-cell"></div>
        </div>
        <p class="rule-text" id="ruleTextRowCol"></p>
      </div>
      <div class="rule-card">
        <div class="rule-diagram">
          <div class="rule-cell x"><span class="mark-x"></span></div>
          <div class="rule-cell x"><span class="mark-x"></span></div>
          <div class="rule-cell x"><span class="mark-x"></span></div>
          <div class="rule-cell x"><span class="mark-x"></span></div>
          <div class="rule-cell flower"><span class="dot"></span></div>
          <div class="rule-cell x"><span class="mark-x"></span></div>
          <div class="rule-cell x"><span class="mark-x"></span></div>
          <div class="rule-cell x"><span class="mark-x"></span></div>
          <div class="rule-cell x"><span class="mark-x"></span></div>
        </div>
        <p class="rule-text" id="ruleTextTouch"></p>
      </div>
    </section>
  </div>
  <div class="bed-tracker" id="bedTracker"></div>
  <div class="helpers-row" id="helpersRow">
    <div class="helper-item">
      <button class="helper-button" id="helperButtonFinder" data-helper="finder" type="button">
        <span class="helper-icon" id="helperIconFinder" aria-hidden="true"></span>
        <span class="helper-charge-badge" id="helperBadgeFinder"></span>
      </button>
      <span class="helper-lock-caption" id="helperLockCaptionFinder" hidden></span>
    </div>
    <div class="helper-item">
      <button class="helper-button" id="helperButtonRandom" data-helper="random" type="button">
        <span class="helper-icon" id="helperIconRandom" aria-hidden="true"></span>
        <span class="helper-charge-badge" id="helperBadgeRandom"></span>
      </button>
      <span class="helper-lock-caption" id="helperLockCaptionRandom" hidden></span>
    </div>
    <div class="helper-item">
      <button class="helper-button" id="helperButtonSnowman" data-helper="snowman" type="button">
        <span class="helper-icon" id="helperIconSnowman" aria-hidden="true"></span>
        <span class="helper-charge-badge" id="helperBadgeSnowman"></span>
      </button>
      <span class="helper-lock-caption" id="helperLockCaptionSnowman" hidden></span>
    </div>
  </div>
  <main class="board-wrap">
    <div class="board" id="board"></div>
  </main>
  </div>
  <div class="overlay" id="winOverlay" hidden>
    <div class="overlay-card">
      <div class="cell-mark win-flower" id="winFlower"></div>
      <h2 id="winTitle"></h2>
      <div class="stars" id="starsContainer"></div>
      <p class="rank-title" id="rankTitle"></p>
      <p id="winMessage"></p>
      <p class="best-time" id="bestTimeLine"></p>
      <div class="reward-badge" id="milestoneRewardBadge" hidden>
        <span class="helper-reward-icons" id="milestoneRewardIcons"></span>
        <span id="milestoneRewardAmount"></span>
      </div>
      <button id="nextLevelButton" type="button"></button>
    </div>
  </div>
  <div class="overlay" id="failOverlay" hidden>
    <div class="overlay-card">
      <h2 id="failTitle"></h2>
      <p id="failMessage"></p>
      <button id="retryButton" type="button"></button>
    </div>
  </div>
  <div class="overlay settings-overlay" id="settingsOverlay" hidden>
    <div class="overlay-card settings-card">
      <h2 id="settingsTitleText"></h2>
      <div class="settings-row">
        <span class="settings-row-label" id="themeLabelText"></span>
        <div class="theme-switch" id="themeSwitch" role="group">
          <button class="theme-option" id="themeWinterButton" type="button" data-theme-id="winter"></button>
          <button class="theme-option" id="themeGardenButton" type="button" data-theme-id="garden"></button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-row-label" id="patternsToggleLabelText"></span>
        <button class="toggle-switch" id="patternsToggle" type="button" aria-pressed="false"><span class="toggle-knob"></span></button>
      </div>
      <div class="settings-row">
        <span class="settings-row-label" id="reduceMotionLabelText"></span>
        <button class="toggle-switch" id="reduceMotionToggle" type="button" aria-pressed="false"><span class="toggle-knob"></span></button>
      </div>
      <div class="settings-row">
        <div class="settings-row-text">
          <span class="settings-row-label" id="vibrationLabelText"></span>
          <span class="settings-row-note" id="vibrationUnsupportedNote" hidden></span>
        </div>
        <button class="toggle-switch" id="vibrationToggle" type="button" aria-pressed="true"><span class="toggle-knob"></span></button>
      </div>
      <button class="replay-tutorial-button" id="replayTutorialButton" type="button"></button>
      <button class="overlay-close-button" id="settingsCloseButton" type="button"></button>
    </div>
  </div>
  <div class="overlay checkin-overlay" id="checkinOverlay" hidden>
    <div class="overlay-card checkin-card">
      <h2 id="checkinTitle"></h2>
      <div class="checkin-days" id="checkinDaysRow"></div>
      <p class="checkin-streak-line" id="checkinCurrentStreakText"></p>
      <p class="checkin-streak-line" id="checkinBestStreakText"></p>
      <div class="reward-badge" id="checkinClaimReward" hidden>
        <span class="helper-reward-icons" id="checkinClaimRewardIcons"></span>
        <span id="checkinClaimRewardAmount"></span>
      </div>
      <button id="checkinClaimButton" type="button"></button>
      <button class="overlay-close-button" id="checkinCloseButton" type="button"></button>
    </div>
  </div>
  <div class="overlay tutorial-overlay" id="tutorialOverlay" hidden>
    <div class="tutorial-card" id="tutorialPlay">
      <div class="tutorial-board-wrap">
        <div class="board tutorial-board" id="tutorialBoard"></div>
        <div class="tutorial-hand" id="tutorialHand" hidden></div>
      </div>
      <div class="tutorial-mascot-row">
        <div class="tutorial-mascot" id="tutorialMascot" aria-hidden="true">
          <svg viewBox="0 0 48 40">
            <ellipse cx="24" cy="24" rx="18" ry="14" fill="#e0544f"/>
            <line x1="24" y1="11" x2="24" y2="37" stroke="#2a1f1c" stroke-width="2"/>
            <circle cx="16" cy="18" r="3" fill="#2a1f1c"/>
            <circle cx="32" cy="18" r="3" fill="#2a1f1c"/>
            <circle cx="16" cy="29" r="3" fill="#2a1f1c"/>
            <circle cx="32" cy="29" r="3" fill="#2a1f1c"/>
            <circle cx="24" cy="24" r="3" fill="#2a1f1c"/>
            <circle cx="24" cy="10" r="9" fill="#2a1f1c"/>
            <circle cx="20" cy="8" r="1.6" fill="#fdf6ee"/>
            <circle cx="28" cy="8" r="1.6" fill="#fdf6ee"/>
            <path d="M16 2 Q12 -2 10 2" stroke="#2a1f1c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path d="M32 2 Q36 -2 38 2" stroke="#2a1f1c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="tutorial-bubble" id="tutorialBubble"></p>
      </div>
    </div>
    <div class="overlay-card tutorial-final" id="tutorialFinal" hidden>
      <h2 id="tutorialFinalTitle"></h2>
      <p id="tutorialFinalText"></p>
      <button id="tutorialGotItButton" type="button"></button>
    </div>
  </div>
</div>
<script src="js/i18n.js"></script>
<script src="js/platform.js"></script>
<script src="js/themes.js"></script>
<script src="js/rng.js"></script>
<script src="js/grid.js"></script>
<script src="js/rules.js"></script>
<script src="js/solver.js"></script>
<script src="js/generator.js"></script>
<script src="js/levelstart.js"></script>
<script src="js/helpers.js"></script>
<script src="js/state.js"></script>
<script src="js/menu.js"></script>
<script src="js/checkin.js"></script>
<script src="js/router.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/main.js"></script>
</body>
</html>
