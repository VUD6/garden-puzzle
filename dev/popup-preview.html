<!doctype html>
<html lang="ru" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клумба — зимние попапы</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/winter-ornaments.css">
<link rel="stylesheet" href="../css/winter-popups.css">
<link rel="stylesheet" href="../css/daily-gift.css">
<link rel="stylesheet" href="../css/winter-win.css">
<style>
:root {
  --preview-page: #efe3d4;
  --preview-frame-ink: #e6d2b8;
  --preview-frame-cream: #fff8f0;
  --preview-frame-sand: #f6e9d8;
  --preview-width: 430px;
  --preview-height: 740px;
  --preview-board-size: 320px;
  --preview-top-space: 90px;
  --bed-a: #e67c8a;
  --bed-b: #85beaa;
  --bed-c: #eabf59;
  --bed-d: #86a9d8;
  --stripe-cream: var(--winter-candy-cream);
  --berry: var(--winter-candy-red);
  --board-frame-bg: repeating-linear-gradient(45deg,
    var(--winter-candy-red) 0 var(--winter-plaque-band),
    var(--winter-candy-cream) var(--winter-plaque-band) calc(2 * var(--winter-plaque-band)));
}
body { background: var(--preview-page); }
main { width: min(100%, var(--preview-width)); margin-inline: auto; padding: var(--winter-plaque-margin); }
h1 { margin: 0 0 var(--winter-ui-gap); font-size: 1.25rem; }
nav { display: flex; flex-wrap: wrap; gap: var(--winter-ui-gap); margin-bottom: var(--winter-ui-gap); }
nav a {
  display: grid;
  place-items: center;
  flex: 1;
  min-height: var(--winter-touch);
  padding-inline: var(--winter-ui-gap);
  border: var(--winter-plaque-rule) solid var(--preview-frame-ink);
  border-radius: var(--radius-pill);
  background: var(--preview-frame-cream);
  color: var(--ink);
  text-align: center;
  text-decoration: none;
}
nav a:focus-visible { outline: var(--winter-focus-width) solid var(--pine); }
.phone {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  height: min(var(--preview-height), calc(100dvh - var(--preview-top-space)));
  border-radius: var(--winter-plaque-radius);
  background: linear-gradient(var(--preview-frame-cream), var(--preview-frame-sand));
}
.scene { display: grid; justify-items: center; padding: var(--winter-plaque-padding); }
.preview-board { width: min(100%, var(--preview-board-size)); }
.phone > .overlay { position: absolute; }
.phone > :is(#how, #example, #daily, #winPreview, #losePreview, #starsPreview) { display: none; }
body:has(#show-how:target) #how,
body:has(#show-example:target) #example,
body:has(#show-daily:target) #daily,
body:has(#show-win:target) #winPreview,
body:has(#show-lose:target) #losePreview,
body:has(#show-stars:target) #starsPreview { display: flex; }
body:has(#show-how:target, #show-example:target, #show-daily:target, #show-win:target, #show-lose:target, #show-stars:target, #preview-closed:target) #settings { display: none; }
.tutorial-board { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
.preview-empty { min-height: calc(3 * var(--winter-touch)); }
.preview-empty h2 { padding-inline: var(--winter-touch); }
.preview-daily-label {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: var(--daily-gap);
  margin-top: var(--winter-plaque-padding);
}
.preview-daily-label select {
  min-height: var(--winter-touch);
  max-width: 100%;
  padding-inline: var(--daily-gap);
  color: var(--ink);
  background: var(--panel);
  border: var(--winter-plaque-rule) solid var(--panel-border);
  border-radius: var(--radius-md);
  font: inherit;
}
.preview-daily-label select:focus-visible { outline: var(--winter-focus-width) solid var(--pine); }
.winter-streak-dots[hidden] { display: none; }
#previewStreakBonus svg { width: var(--winter-status-icon); height: var(--winter-status-icon); }
</style>
</head>
<body>
<main>
  <h1 id="preview-closed">Зимние попапы</h1>
  <nav aria-label="Выбор попапа">
    <a id="show-settings" href="#show-settings">Настройки</a>
    <a id="show-how" href="#show-how">Как играть</a>
    <a id="show-daily" href="#show-daily">Награда</a>
    <a id="show-win" href="#show-win">Победа</a>
    <a id="show-lose" href="#show-lose">Проигрыш</a>
    <a id="show-stars" href="#show-stars">Звёзды</a>
    <a id="show-example" href="#show-example">Шаблон</a>
  </nav>
  <div class="phone">
    <div class="scene" aria-hidden="true"><svg class="preview-board" viewBox="0 0 236 236" aria-hidden="true">
        <defs>
          <pattern id="rim" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="16" height="16" fill="var(--stripe-cream)"/>
            <rect width="8" height="16" fill="var(--berry)"/>
          </pattern>
          <rect id="tile" width="54" height="54" rx="9"/>
        </defs>
        <rect width="236" height="236" rx="18" fill="url(#rim)"/>
        <g transform="translate(6 6)">
          <use href="#tile" fill="var(--bed-a)"/><use href="#tile" x="57" fill="var(--bed-a)"/>
          <use href="#tile" x="114" fill="var(--bed-b)"/><use href="#tile" x="171" fill="var(--bed-b)"/>
          <use href="#tile" y="57" fill="var(--bed-a)"/><use href="#tile" x="57" y="57" fill="var(--bed-b)"/>
          <use href="#tile" x="114" y="57" fill="var(--bed-b)"/><use href="#tile" x="171" y="57" fill="var(--bed-c)"/>
          <use href="#tile" y="114" fill="var(--bed-d)"/><use href="#tile" x="57" y="114" fill="var(--bed-d)"/>
          <use href="#tile" x="114" y="114" fill="var(--bed-c)"/><use href="#tile" x="171" y="114" fill="var(--bed-c)"/>
          <use href="#tile" y="171" fill="var(--bed-d)"/><use href="#tile" x="57" y="171" fill="var(--bed-d)"/>
          <use href="#tile" x="114" y="171" fill="var(--bed-c)"/><use href="#tile" x="171" y="171" fill="var(--bed-c)"/>
        </g>
      </svg></div>
    <div class="overlay settings-overlay winter-plaque-overlay" id="settings">
    <div class="overlay-card settings-card winter-plaque">
      <h2 id="settingsTitleText">Настройки</h2>
      <div class="settings-row">
        <span class="settings-row-label" id="themeLabelText">Тема</span>
        <div class="theme-switch" id="themeSwitch" role="group">
          <button class="theme-option active" id="themeWinterButton" type="button">Зима</button>
          <button class="theme-option" id="themeGardenButton" type="button">Сад</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-row-label" id="patternsToggleLabelText">Узоры на клумбах</span>
        <button class="toggle-switch" id="patternsToggle" type="button" aria-pressed="false"><span class="toggle-knob"></span></button>
      </div>
      <div class="settings-row">
        <span class="settings-row-label" id="reduceMotionLabelText">Меньше анимации</span>
        <button class="toggle-switch" id="reduceMotionToggle" type="button" aria-pressed="false"><span class="toggle-knob"></span></button>
      </div>
      <div class="settings-row">
        <div class="settings-row-text">
          <span class="settings-row-label" id="vibrationLabelText">Вибрация при ошибке</span>
          <span class="settings-row-note" id="vibrationUnsupportedNote" hidden>Не поддерживается на этом устройстве</span>
        </div>
        <button class="toggle-switch" id="vibrationToggle" type="button" aria-pressed="true"><span class="toggle-knob"></span></button>
      </div>
      <button class="replay-tutorial-button winter-plaque-primary" id="replayTutorialButton" type="button">Обучение</button>
      <button class="overlay-close-button" id="settingsCloseButton" type="button" aria-label="Закрыть" data-preview-close></button>
    </div>
    </div>
    <div class="overlay tutorial-overlay winter-plaque-overlay" id="how">
      <div class="tutorial-card winter-plaque" id="tutorialPlay">
        <div class="tutorial-mascot-row">
          <p class="tutorial-bubble">Дважды коснитесь клетки, чтобы поставить пряник</p>
        </div>
        <div class="tutorial-board-wrap">
          <div class="board tutorial-board"><div class="cell region-0 tutorial-dim"></div><div class="cell region-0 tutorial-active"></div><div class="cell region-1 tutorial-dim"></div><div class="cell region-1 tutorial-dim"></div><div class="cell region-0 tutorial-dim"></div><div class="cell region-0 tutorial-dim"></div><div class="cell region-2 tutorial-dim"></div><div class="cell region-1 tutorial-dim"></div><div class="cell region-3 tutorial-dim"></div><div class="cell region-2 tutorial-dim"></div><div class="cell region-2 tutorial-dim"></div><div class="cell region-1 tutorial-dim"></div><div class="cell region-3 tutorial-dim"></div><div class="cell region-3 tutorial-dim"></div><div class="cell region-2 tutorial-dim"></div><div class="cell region-2 tutorial-dim"></div></div>
        </div>
      </div>
    </div>
    <div class="overlay checkin-overlay daily-popup winter-plaque-overlay" id="daily">
      <div class="overlay-card checkin-card winter-plaque">
        <h2 id="checkinTitle"></h2>
        <div class="checkin-days" id="checkinDaysRow"></div>
        <p class="checkin-streak-line" id="checkinCurrentStreakText"></p>
        <p class="checkin-streak-line" id="checkinBestStreakText" hidden></p>
        <button class="winter-plaque-primary" id="checkinClaimButton" type="button"></button>
        <button class="overlay-close-button" type="button" aria-label="Закрыть" data-preview-close></button>
        <label class="preview-daily-label">
          Превью
          <select id="preview-daily-state">
            <option value="1">Доступна</option>
            <option value="claimed">Получена</option>
            <option value="4">День 4</option>
            <option value="7">День 7</option>
          </select>
        </label>
      </div>
    </div>
    <div class="overlay winter-plaque-overlay" id="winPreview">
      <div class="overlay-card winter-plaque winter-win">
        <div class="cell-mark win-flower" id="previewWinPiece"></div>
        <h2 class="result-text" id="previewWinTitle"></h2>
        <div class="stars star-pop" id="previewWinStars"></div>
        <p class="rank-title" id="previewWinRank"></p>
        <p id="previewWinPoints"></p>
        <p class="best-time" id="previewWinTime"></p>
        <div class="reward-badge" id="previewWinMilestone" hidden>
          <span class="helper-reward-icons" id="previewWinHelpers"></span>
          <span id="previewWinAmount"></span>
        </div>
        <p class="win-streak" id="previewStreak" hidden></p>
        <p class="win-streak-hint" id="previewStreakHint" hidden></p>
        <div class="winter-streak-dots" id="previewStreakDots" hidden></div>
        <div class="reward-badge win-streak-bonus" id="previewStreakBonus" hidden></div>
        <button class="winter-plaque-primary" id="previewWinNext" type="button" data-preview-close></button>
        <label class="preview-daily-label">Превью
          <select id="preview-win-state">
            <option value="1">1 звезда</option>
            <option value="2">2 звезды</option>
            <option value="3">3 звезды</option>
            <option value="streak2">Серия 2</option><option value="streak4">Серия 4</option><option value="streak5">Серия 5 · бонус</option>
            <option value="milestone">Праздничный уровень</option>
          </select>
        </label>
      </div>
    </div>
    <div class="overlay winter-plaque-overlay" id="losePreview">
      <div class="overlay-card winter-plaque winter-lose">
        <div class="winter-spent-decoration" aria-hidden="true"><span></span><span></span><span></span></div>
        <h2 id="previewLoseTitle"></h2><p id="previewLoseText"></p>
        <button class="winter-plaque-primary" id="previewLoseRetry" data-preview-close></button>
      </div>
    </div>
    <div class="overlay winter-plaque-overlay" id="starsPreview">
      <div class="overlay-card winter-plaque">
        <p class="menu-total-stars is-updated">★ 0</p>
        <p class="menu-total-stars is-updated">★ 999999</p>
      </div>
    </div>
    <div class="overlay winter-plaque-overlay" id="example">
      <div class="overlay-card winter-plaque preview-empty">
        <h2>Шаблон</h2>
        <button class="overlay-close-button" type="button" aria-label="Закрыть" data-preview-close></button>
      </div>
    </div>
  </div>
</main>
<script src="../js/i18n.js"></script>
<script src="../js/themes.js"></script>
<script src="../js/checkin.js"></script>
<script>
  Garden.themes.applyTheme('winter');
  const { checkin, themes, i18n } = Garden;
  const dailyState = document.getElementById('preview-daily-state');
  const claimButton = document.getElementById('checkinClaimButton');
  const plan = {
    day3Helper: 'snowman',
    day4Helper: 'random',
    day7Helpers: ['finder', 'random', 'snowman'],
  };

  let lastPreviewClaim = 1;

  function renderDailyPreview() {
    const claimed = dailyState.value === 'claimed';
    const next = claimed ? checkin.nextPositionAfter(lastPreviewClaim) : Number(dailyState.value);
    document.getElementById('checkinTitle').textContent = i18n.t('dailyCheckinButtonLabel');
    document.getElementById('checkinCurrentStreakText').textContent = i18n.t('dailyGiftDayLabel', { day: next });
    const tomorrow = document.getElementById('checkinBestStreakText');
    tomorrow.textContent = i18n.t('dailyGiftComeBackTomorrow');
    tomorrow.hidden = !claimed;
    claimButton.disabled = claimed;
    claimButton.textContent = i18n.t(claimed ? 'checkinClaimedButton' : 'checkinClaimButton');
    const cards = [];
    for (let day = 1; day <= checkin.CYCLE_LENGTH; day++) {
      const alreadyClaimed = claimed ? day <= lastPreviewClaim : day < next;
      const state = alreadyClaimed ? 'claimed' : day !== next ? 'upcoming' : claimed ? 'paused' : 'today';
      const rewards = checkin.rewardForDay(day, plan).map(({helperId, amount}) =>
        '<span class="daily-day-reward-item"><span class="helper-reward-icons">' +
        themes.getCurrentTheme().helperIconSvg(helperId) + '</span><span>+' + amount + '</span></span>'
      ).join('');
      cards.push('<div class="daily-day" data-day="' + day + '" data-special="' + checkin.isSpecialDay(day) +
        '" data-state="' + state + '"><div class="daily-day-mark">' + day +
        '</div><div class="daily-day-reward">' + rewards + '</div></div>');
    }
    document.getElementById('checkinDaysRow').innerHTML = cards.join('');
  }
  dailyState.addEventListener('change', () => {
    lastPreviewClaim = 1;
    renderDailyPreview();
  });
  claimButton.addEventListener('click', () => {
    lastPreviewClaim = Number(dailyState.value);
    dailyState.value = 'claimed';
    renderDailyPreview();
  });
  renderDailyPreview();
  const winSelect = document.getElementById('preview-win-state');
  function renderWinPreview() {
    const milestone = winSelect.value === 'milestone';
    const streak = winSelect.value.startsWith('streak') ? Number(winSelect.value.slice(6)) : 0;
    const rating = milestone || streak ? 3 : Number(winSelect.value);
    const starPath = 'M12 2l2.9 6.26L22 9.27l-5 5.13L18.18 22 12 18.56 5.82 22 7 14.4l-5-5.13 7.1-1.01L12 2z';
    document.getElementById('previewWinPiece').innerHTML = themes.getCurrentTheme().pieceArt();
    document.getElementById('previewWinTitle').textContent = i18n.t(rating === 3 ? 'resultPerfect' : 'resultDone');
    document.getElementById('previewWinStars').innerHTML = Array.from({length: 3}, (_, index) =>
      '<svg viewBox="0 0 24 24" class="star-' + (index < rating ? 'filled' : 'empty') +
      '" aria-hidden="true"><path d="' + starPath + '"/></svg>').join('');
    document.getElementById('previewWinRank').textContent = i18n.t(['', 'rankGardener', 'rankSkilledGardener', 'rankMasterGardener'][rating]);
    document.getElementById('previewWinPoints').textContent = i18n.t('scoreEarnedLabel', { amount: 120 });
    document.getElementById('previewWinTime').textContent = i18n.t('bestTimeLabel', { time: '01:24' });
    document.getElementById('previewWinMilestone').hidden = !milestone;
    document.getElementById('previewWinHelpers').innerHTML = ['finder', 'random', 'snowman'].map(id => themes.getCurrentTheme().helperIconSvg(id)).join('');
    document.getElementById('previewWinAmount').textContent = '+1';
    document.getElementById('previewStreak').hidden = !streak;
    document.getElementById('previewStreakHint').hidden = !streak;
    document.getElementById('previewStreakDots').hidden = !streak;
    document.getElementById('previewStreakBonus').hidden = streak !== 5;
    document.getElementById('previewStreak').textContent = i18n.t('winStreakLabel', { count: streak });
    document.getElementById('previewStreakHint').textContent = i18n.t('winStreakHint', { count: streak === 5 ? 5 : 5 - streak });
    document.getElementById('previewStreakDots').innerHTML = Array.from({length: 5}, (_, i) =>
      '<span class="' + (i < streak ? 'filled' : '') + '"></span>').join('');
    document.getElementById('previewStreakBonus').innerHTML = themes.getCurrentTheme().helperIconSvg('finder') + '<span>+1</span>';
    document.getElementById('previewWinNext').textContent = i18n.t('nextLevelButton');
  }
  winSelect.addEventListener('change', renderWinPreview);
  renderWinPreview();
  document.getElementById('previewLoseTitle').textContent = i18n.t('failTitle');
  document.getElementById('previewLoseText').textContent = i18n.t('failMessage');
  document.getElementById('previewLoseRetry').textContent = i18n.t('retryButton');
  document.getElementById('replayTutorialButton').addEventListener('click', () => { location.hash = 'show-how'; });
  document.querySelectorAll('[data-preview-close]').forEach(button => {
    button.addEventListener('click', () => { location.hash = 'preview-closed'; });
  });
  document.querySelectorAll('.toggle-switch').forEach(button => {
    button.addEventListener('click', () => {
      button.setAttribute('aria-pressed', button.getAttribute('aria-pressed') === 'false');
    });
  });
  document.querySelectorAll('.theme-option').forEach(button => {
    button.addEventListener('click', () => {
      document.querySelector('.theme-option.active').classList.remove('active');
      button.classList.add('active');
    });
  });
</script>
</body>
</html>
