<!doctype html>
<html lang="ru" data-theme="winter">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клумба — зимнее превью</title>
<link rel="stylesheet" href="../css/winter-ornaments.css">
<style>
/* Winter values copied from js/themes.js. Preview extensions follow below. */
:root {
  --bg-top:#fdf0ea; --bg-bottom:#f7e3d0; --ink:#4a3220; --ink-soft:#8a7260;
  --panel:#fff8f0; --panel-soft:#f6e9d8; --panel-border:#e6d2b8; --accent:#3e8f57;
  --region-0:#4fb892; --region-1:#e24b64; --region-2:#e8c23a; --region-3:#8a5fc2; --region-4:#4f7fd1; --region-5:#e8863f; --region-6:#8cc43f; --region-7:#c94a9e;
  --board-frame-bg:repeating-linear-gradient(45deg,var(--winter-candy-red) 0px 10px,var(--winter-candy-cream) 10px 20px);
  --tile-highlight:inset 0 2px 0 rgba(255,250,240,.45);
  --tile-edge:inset 0 -3px 0 rgba(90,110,140,.28);
  --tile-sheen:inset 0 0 0 100px rgba(255,250,240,.14);
  --tile-lock-ring:inset 0 0 0 3px rgba(255,250,240,.55);
  --notification-dot-color:#3f6fc0; --mark-wrong:#e0574f;
  --snow:#f7f0e7; --snow-shadow:#e9ded5; --cookie:#ce8a52; --crust:#804623;
  --berry:#b8413f; --pine:#35684f; --mint:#639781; --blue:#325c83; --gold:#e8b55d;
  --desk:#eae0d6; --rim:#674b3b; --shadow:0 3px 0 #e6d2b8,0 7px 14px #674b3b16;
  --frame-shadow:0 14px 36px #674b3b26; --frame-width:390px; --frame-height:844px;
  --rim-size:1px; --gap:8px; --space:16px; --pad:20px; --radius:18px; --round:999px;
  --touch:44px; --helper:56px; --icon:24px; --badge:21px; --tile-gap:4px; --board-pad:9px; --dense-width:282px;
  --title:clamp(2.6rem,12vw,3.8rem); --small:.78rem; --body:1rem; --label:.68rem;
  --large-chef:132px; --small-chef:56px; --hero-art:246px; --helper-icon:32px; --diagram:33px; --sample-title:1.8rem; --landscape-art:164px;
  --nav-gap:24px; --tray:113px; --tree-offset:0; --press:2px;
  --face-ui:'Comfortaa','Century Gothic','Segoe UI',sans-serif;
}
* {box-sizing:border-box}
body {margin:0;background:var(--desk);color:var(--ink);font:var(--body)/1.4 var(--face-ui)}
h1,h2,h3,p {margin:0}
header {text-align:center;padding:var(--nav-gap) var(--gap)}
.gallery > header {flex-basis:100%}
header p, figcaption {color:var(--ink)}
.gallery {display:flex;flex-wrap:wrap;justify-content:center;gap:var(--nav-gap);padding:0 var(--gap) var(--nav-gap)}
figure {margin:0;width:min(100%,var(--frame-width))}
figcaption {margin-block-end:var(--gap);font-weight:800;text-align:center}
.phone {width:100%;height:var(--frame-height);border:var(--rim-size) solid var(--rim);border-radius:var(--radius);overflow:auto;position:relative;isolation:isolate;background:linear-gradient(155deg,var(--bg-top),var(--bg-bottom));box-shadow:var(--frame-shadow)}
.menu,.game,.samples {padding:var(--pad);display:flex;flex-direction:column;gap:var(--space);text-align:center}
.menu {align-items:center;overflow:hidden}
.menu > :not(.landscape) {z-index:1}
.menu h2 {font-size:var(--title);letter-spacing:-.045em;line-height:1;color:var(--pine)}
.menu .subtitle {font-weight:700}
button {font-family:inherit}
.menu .heading {margin-block-start:var(--nav-gap)}
.artwork {display:block;width:min(100%,var(--hero-art));height:var(--hero-art)}
.landscape {position:absolute;inset:auto var(--tree-offset) 0;width:100%;height:var(--landscape-art);pointer-events:none}
.actions {width:100%;display:grid;gap:var(--gap)}
button {font:inherit;color:inherit;border:0;cursor:pointer}
button:disabled {cursor:default}
button:focus-visible {outline:var(--press) solid var(--blue);outline-offset:var(--press)}
.control {position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--gap);min-height:var(--touch);border:var(--rim-size) solid var(--panel-border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);padding-inline:var(--space);font-weight:800}
.primary {background:linear-gradient(var(--panel),var(--panel-soft));min-height:var(--helper);overflow:hidden;color:var(--pine)}
.primary::before {content:"";position:absolute;inset:auto 0 0;height:var(--tile-gap);background:var(--board-frame-bg);opacity:.58}
.pressed,.control:active:not(:disabled) {transform:translateY(var(--press));box-shadow:var(--tile-edge)}
.muted,.locked {background:var(--panel-soft);color:var(--ink-soft);box-shadow:none}
.locked {border-style:dashed}
.round {width:var(--touch);padding:0;border-radius:var(--round)}
.ico {display:block;width:var(--icon);height:var(--icon);flex:none}
.dot {position:absolute;inset:var(--gap) var(--gap) auto auto;width:var(--gap);aspect-ratio:1;border-radius:var(--round);background:var(--notification-dot-color)}
.card {background:var(--panel);border:var(--rim-size) solid var(--panel-border);border-radius:var(--radius);padding:var(--gap)}
.samples {gap:var(--gap)}
.samples h3 {font-size:var(--body)}
.control-grid {display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap)}
.chef-pair,.tutorial {display:flex;align-items:center;justify-content:center;gap:var(--gap)}
.chef-large {width:var(--large-chef);height:var(--large-chef);display:block}
.chef-small {width:var(--small-chef);height:var(--small-chef);flex:none}
.chef-pair figcaption {font-size:var(--small)}
.chef-pair > div {display:grid;justify-items:center}
.bubble {text-align:left;position:relative;font-size:var(--small)}
.bubble::before {content:"";position:absolute;inset:40% auto auto calc(-1 * var(--tile-gap));width:var(--gap);aspect-ratio:1;background:var(--panel);transform:rotate(45deg);border-left:var(--rim-size) solid var(--panel-border);border-bottom:var(--rim-size) solid var(--panel-border)}
.helpers {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);justify-items:center}
.helper-item {display:grid;justify-items:center;gap:var(--tile-gap);font-size:var(--small);font-weight:800}
.helper {width:var(--helper);min-height:var(--helper);padding:0;border-radius:var(--round)}
.helper .ico {width:var(--helper-icon);height:var(--helper-icon)}
.charge {position:absolute;inset:calc(-1 * var(--tile-gap)) calc(-1 * var(--tile-gap)) auto auto;min-width:var(--badge);height:var(--badge);display:grid;place-items:center;background:var(--pine);color:var(--panel);border:var(--press) solid var(--panel);border-radius:var(--round);font-size:var(--label)}
.muted .charge {background:var(--ink-soft)}
.lock-caption {font-weight:800;font-size:var(--label)}
.topbar {display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:var(--gap)}
.topbar .round:last-child {justify-self:end}
.level {font-weight:900}
.lives {display:flex;justify-content:center;gap:var(--tile-gap);}
.rules {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--tile-gap)}
.rule {font-size:var(--label);font-weight:800;line-height:1.2;display:grid;justify-items:center;gap:var(--tile-gap)}
.rule svg {width:var(--diagram);height:var(--diagram)}
.tracker {display:flex;justify-content:center;align-items:center;gap:var(--gap);font-weight:800;font-size:var(--small)}
.swatch {width:var(--icon);height:var(--icon);border-radius:var(--gap);background:var(--bed);box-shadow:var(--tile-highlight),var(--tile-edge)}
.r0 {--bed:var(--region-0)} .r1 {--bed:var(--region-1)} .r2 {--bed:var(--region-2)} .r3 {--bed:var(--region-3)} .r4 {--bed:var(--region-4)}
.board {position:relative;display:grid;grid-template-columns:repeat(var(--columns,5),minmax(0,1fr));gap:var(--tile-gap);padding:var(--board-pad);border-radius:var(--radius)}
.board::before {content:"";position:absolute;inset:0;padding:var(--board-pad);border-radius:inherit;background:var(--board-frame-bg);mask:linear-gradient(var(--panel) 0 0) content-box,linear-gradient(var(--panel) 0 0);mask-composite:exclude;pointer-events:none}
.board.dense {--columns:8;width:min(100%,var(--dense-width));margin-inline:auto}
.subtitle-choices {display:grid;gap:var(--gap)}
.menu-heading {display:grid;gap:var(--tile-gap);padding:var(--space)}
.menu-heading strong {color:var(--pine);font-size:var(--sample-title)}
.r5 {--bed:var(--region-5)} .r6 {--bed:var(--region-6)} .r7 {--bed:var(--region-7)}
.tile {aspect-ratio:1;display:grid;place-items:center;background:var(--bed);border-radius:var(--gap);box-shadow:var(--tile-highlight),var(--tile-edge),var(--tile-sheen);color:var(--panel)}
.tile.fixed {box-shadow:var(--tile-lock-ring),var(--tile-highlight),var(--tile-edge),var(--tile-sheen)}
.tile.wrong {color:var(--berry)}
.tile svg {width:65%;height:65%}
.game .helpers {margin-block-start:var(--gap)}
.game .tutorial {margin-block-start:auto}
.symbols {position:absolute;width:0;height:0;overflow:hidden}
@media (prefers-reduced-motion:reduce) {.control:active:not(:disabled){transform:none}}
.lives-zoom {
  --winter-candy-size: calc(32px * var(--winter-candy-preview-scale));
}
</style>

<header><h1>Клумба</h1><p>Зимний дизайн · превью для согласования</p></header>

  <figure><figcaption>Главное меню</figcaption>
    <section class="phone menu" aria-label="Главное меню">
      <div class="heading"><h2>Клумба</h2><p class="subtitle">Уютная головоломка</p></div>
      <svg class="artwork" viewBox="0 0 246 246" aria-label="Пряничный повар" role="img">

        <circle cx="123" cy="125" r="101" fill="none" stroke="var(--panel)" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>

        <button class="control"><svg class="ico" aria-hidden="true"><use href="#gift"/></svg>Ежедневная награда<span class="dot" aria-label="Доступна"></span></button>
        <button class="control locked" disabled><svg class="ico" aria-hidden="true"><use href="#lock"/></svg>Испытание дня</button>
      </div>
